<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | MedTrack</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>

    <nav class="navbar">

        <div class="logo">
            MedTrack
        </div>

        <div class="nav-links">

            <a href="/">
                Home
            </a>

            <a href="/register">
                Register
            </a>

        </div>

    </nav>


    <main class="auth-container">

        <div class="auth-card">

            <h1>Welcome Back</h1>

            <p class="auth-description">
                Login to your MedTrack account.
            </p>


            {% if error %}

                <div class="error-message">
                    {{ error }}
                </div>

            {% endif %}


            <form method="POST" action="/login">


                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit"
                        class="auth-button">

                    Login

                </button>

            </form>


            <p class="auth-footer">

                Don't have an account?

                <a href="/register">
                    Create Account
                </a>

            </p>

        </div>

    </main>

</body>

</html>
